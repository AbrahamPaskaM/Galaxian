<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxian - Classic Arcade</title>
</head>
<body>

    <!-- CONTAINER UTAMA -->
    <div id="game-wrapper">

        <!-- AREA GAME UTAMA -->
        <div id="game-container">

            <!-- 1. HUD: Informasi Permainan -->
            <div id="hud">
                <span id="score-display">SCORE: 0000</span>
                <span id="wave-display">WAVE: 1</span>
                <span id="hi-display">HI: 0000</span>
                <span id="lives-display">♥ 3</span>
            </div>

            <!-- 2. CANVAS: Area Render Game -->
            <canvas id="gameCanvas" width="500" height="600"></canvas>

            <!-- 3. OVERLAY: Layar Menu -->
            <div id="overlay">
                <h1>GALAXIAN</h1>
                <h2>CLASSIC ARCADE</h2>
                <p>Tembak alien sebelum mereka mencapai Anda!</p>
                <button id="start-btn">START GAME</button>
            </div>

        </div>

        <!-- 4. TOUCH CONTROLS: Tombol Virtual -->
        <div id="touch-controls">
            <div class="dpad">
                <button class="ctrl-btn" id="btn-left">◀</button>
                <button class="ctrl-btn" id="btn-right">▶</button>
            </div>
            <button class="ctrl-btn fire-btn" id="btn-fire">FIRE</button>
        </div>

    </div>

    <script src="game.js"></script>
</body>
</html>
